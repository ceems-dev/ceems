          description: Identifier of the resource manager that owns project. It is
            used to differentiate multiple clusters of same resource manager.
          example: slurm-0
          type: string
        name:
          description: Name of the project
          example: prj1
          type: string
        resource_manager:
          description: Name of the resource manager that owns project. Eg slurm, openstack,
            kubernetes, etc
          example: slurm
          type: string
        tags:
          description: List of meta data tags of the project
          example:
          - tag1
          - tag2
          items: {}
          type: array
          uniqueItems: false
        uid:
          description: Unique identifier of the project provided by cluster
          example: "1000"
          type: string
        users:
          description: List of users of the project
          example:
          - usr1
          - usr2
          items: {}
          type: array
          uniqueItems: false
      type: object
    models.Stat:
      properties:
        cluster_id:
          description: Identifier of the resource manager that owns compute unit.
            It is used to differentiate multiple clusters of same resource manager.
          example: slurm-0
          type: string
        num_active_units:
          description: Number of active units that are in running state
          example: 800
          type: integer
        num_inactive_units:
          description: Number of inactive units that are in terminated/cancelled/error
            state
          example: 200
          type: integer
        num_projects:
          description: Number of projects
          example: 200
          type: integer
        num_units:
          description: Number of active and terminated units
          example: 1000
          type: integer
        num_users:
          description: Number of users
          example: 500
          type: integer
        resource_manager:
          description: Name of the resource manager that owns project. Eg slurm, openstack,
            kubernetes, etc
          example: slurm
          type: string
      type: object
    models.Unit:
      properties:
        allocation:
          additionalProperties:
            type: number
          description: Allocation map of unit. Only string and int64 values are supported
            in map
          example:
            cpus: 1
            gpus: 1
            mem: 10
          type: object
        avg_cpu_mem_usage:
          additionalProperties:
            type: number
          description: Average CPU memory usage(s) during lifetime of unit
          example:
            global: 45.26
          type: object
        avg_cpu_usage:
          additionalProperties:
            type: number
          description: Average CPU usage(s) during lifetime of unit
          example:
            global: 70.12
          type: object
        avg_custom_stats:
          additionalProperties:
            type: number
          description: Average statistics of misc custom metrics of unit. These metrics
            can be anything where average value is relevant
          example:
            mem_bw_avg: 2545
          type: object
        avg_gpu_mem_usage:
          additionalProperties:
            type: number
          description: Average GPU memory usage(s) during lifetime of unit
          example:
            global: 45.26
          type: object
        avg_gpu_usage:
          additionalProperties:
            type: number
          description: Average GPU usage(s) during lifetime of unit
          example:
            global: 70.12
          type: object
        cluster_id:
          description: Identifier of the resource manager that owns compute unit.
            It is used to differentiate multiple clusters of same resource manager.
          example: slurm-0
          type: string
        created_at:
          description: Creation time
          example: 2023-02-21T15:48:20+0100
          type: string
        created_at_ts:
          description: Creation timestamp
          example: 1676990900000
          type: integer
        elapsed:
          description: Human readable total elapsed time string
          example: 2-00:10:20
          type: string
        ended_at:
          description: End time
          example: Unknown
          type: string
        ended_at_ts:
          description: End timestamp
          example: 0
          type: integer
        groupname:
          description: User group
          example: grp1
          type: string
        max_custom_stats:
          additionalProperties:
            type: number
          description: Maximum statistics of misc custom metrics of unit. These metrics
            can be anything where maxoimum value is relevant
          example:
            gpu_power_max: 454
          type: object
        min_custom_stats:
          additionalProperties:
            type: number
          description: Minimum statistics of misc custom metrics of unit. These metrics
            can be anything where minimum value is relevant
          example:
            host_pwr_min: 36
          type: object
        name:
          description: Name of compute unit
          example: my-slurm-job
          type: string
        project:
          description: Account in batch systems, Tenant in Openstack, Namespace in
            k8s
          example: prj1
          type: string
        resource_manager:
          description: Name of the resource manager that owns compute unit. Eg slurm,
            openstack, kubernetes, etc
          example: slurm
          type: string
        started_at:
          description: Start time
          example: 2023-02-21T15:49:06+0100
          type: string
        started_at_ts:
          description: Start timestamp
          example: 1676990946000
          type: integer
        state:
          description: Current state of unit
          example: RUNNING
          type: string
        tags:
          additionalProperties:
            type: string
          description: A map to store generic info. String and int64 are valid value
            types of map
          example:
            gid: "1000"
            uid: "1000"
            workdir: /home/user
          type: object
        total_cpu_emissions_gms:
          additionalProperties:
            type: number
          description: Total CPU emissions from source(s) in grams during lifetime
            of unit
          example:
            emaps_total: 3.09
            owid_total: 5.22
          type: object
        total_cpu_energy_usage_kwh:
          additionalProperties:
            type: number
          description: Total CPU energy usage(s) in kWh during lifetime of unit
          example:
            total: 0.73
          type: object
        total_custom_stats:
          additionalProperties:
            type: number
          description: Total statistics of misc custom metrics of unit. These metrics
            can be anything where total value is relevant
          example:
            cycles_total: 23232323
            instr_total: 454342323
          type: object
        total_egress_stats:
          additionalProperties:
            type: number
          description: Total Outgress statistics of unit
          example:
            bytes_total: 454342323
            packets_total: 23232323
          type: object
        total_gpu_emissions_gms:
          additionalProperties:
            type: number
          description: Total GPU emissions from source(s) in grams during lifetime
            of unit
          example:
            emaps_total: 12.09
            owid_total: 15.22
          type: object
        total_gpu_energy_usage_kwh:
          additionalProperties:
            type: number
          description: Total GPU energy usage(s) in kWh during lifetime of unit
          example:
            total: 5.39
          type: object
        total_ingress_stats:
          additionalProperties:
            type: number
          description: Total Ingress statistics of unit
          example:
            bytes_total: 8503405
            packets_total: 43423
          type: object
        total_io_read_stats:
          additionalProperties:
            type: number
          description: Total IO read statistics during lifetime of unit
          example:
            bytes_total: 245000000
            requests_total: 49423
          type: object
        total_io_write_stats:
          additionalProperties:
            type: number
          description: Total IO write statistics during lifetime of unit
          example:
            bytes_total: 12000000
            requests_total: 13923
          type: object
        total_time_seconds:
          additionalProperties:
            type: number
          description: Different types of times in seconds consumed by the unit. This
            map contains at minimum `walltime`, `alloc_cputime`, `alloc_cpumemtime`,
            `alloc_gputime` and `alloc_gpumem_time` keys.
          example:
            alloc_cpumemtime: 1000
            alloc_cputime: 100
            alloc_gpumemtime: 100
            alloc_gputime: 100
            walltime: 100
          type: object
        username:
          description: Username
          example: usr1
          type: string
        uuid:
          description: Unique identifier of unit. It can be Job ID for batch jobs,
            UUID for pods in k8s or VMs in Openstack
          example: "193048"
          type: string
      type: object
    models.Usage:
      properties:
        avg_cpu_mem_usage:
          additionalProperties:
            type: number
          description: Average CPU memory usage(s) during lifetime of project
          example:
            global: 45.26
          type: object
        avg_cpu_usage:
          additionalProperties:
            type: number
          description: Average CPU usage(s) during lifetime of project
          example:
            global: 70.12
          type: object
        avg_custom_stats:
          additionalProperties:
            type: number
          description: Average statistics of misc custom metrics during lifetime of
            project. These metrics can be anything where average value is relevant
          example:
            mem_bw_avg: 2545
          type: object
        avg_gpu_mem_usage:
          additionalProperties:
            type: number
          description: Average GPU memory usage(s) during lifetime of project
          example:
            global: 45.26
          type: object
        avg_gpu_usage:
          additionalProperties:
            type: number
          description: Average GPU usage(s) during lifetime of project
          example:
            global: 70.12
          type: object
        cluster_id:
          description: Identifier of the resource manager that owns compute unit.
            It is used to differentiate multiple clusters of same resource manager.
          example: slurm-0
          type: string
        groupname:
          description: User group
          example: grp1
          type: string
        max_custom_stats:
          additionalProperties:
            type: number
          description: Maximum statistics of misc custom metrics during lifetime of
            project. These metrics can be anything where maxoimum value is relevant
          example:
            gpu_power_max: 454
          type: object
        min_custom_stats:
          additionalProperties:
            type: number
          description: Minimum statistics of misc custom metrics during lifetime of
            project. These metrics can be anything where minimum value is relevant
          example:
            host_pwr_min: 36
          type: object
        num_units:
          description: Number of consumed units
          example: 145
          type: integer
        project:
          description: Account in batch systems, Tenant in Openstack, Namespace in
            k8s
          example: prj1
          type: string
        resource_manager:
          description: Name of the resource manager that owns project. Eg slurm, openstack,
            kubernetes, etc
          example: slurm
          type: string
        total_cpu_emissions_gms:
          additionalProperties:
            type: number
          description: Total CPU emissions from source(s) in grams during lifetime
            of project
          example:
            emaps_total: 3.09
            owid_total: 5.22
          type: object
        total_cpu_energy_usage_kwh:
          additionalProperties:
            type: number
          description: Total CPU energy usage(s) in kWh during lifetime of project
          example:
            total: 0.73
          type: object
        total_custom_stats:
          additionalProperties:
            type: number
          description: Total statistics of misc custom metrics during lifetime of
            project. These metrics can be anything where total value is relevant
          example:
            cycles_total: 23232323
            instr_total: 454342323
          type: object
        total_egress_stats:
          additionalProperties:
            type: number
          description: Total Egress statistics of project
          example:
            bytes_total: 454342323
            packets_total: 23232323
          type: object
        total_gpu_emissions_gms:
          additionalProperties:
            type: number
          description: Total GPU emissions from source(s) in grams during lifetime
            of project
          example:
            emaps_total: 12.09
            owid_total: 15.22
          type: object
        total_gpu_energy_usage_kwh:
          additionalProperties:
            type: number
          description: Total GPU energy usage(s) in kWh during lifetime of project
          example:
            total: 5.39
          type: object
        total_ingress_stats:
          additionalProperties:
            type: number
          description: Total Ingress statistics of project
          example:
            bytes_total: 8503405
            packets_total: 43423
          type: object
        total_io_read_stats:
          additionalProperties:
            type: number
          description: Total IO read statistics during lifetime of project
          example:
            bytes_total: 245000000
            requests_total: 49423
          type: object
        total_io_write_stats:
          additionalProperties:
            type: number
          description: Total IO write statistics during lifetime of project
          example:
            bytes_total: 12000000
            requests_total: 13923
