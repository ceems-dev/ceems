externalDocs:
  description: ""
  url: https://ceems-dev.github.io/ceems/
info:
  contact:
    email: mahendra.paipuri@gmail.com
    name: Mahendra Paipuri
    url: https://github.com/ceems-dev/ceems/issues
  description: |-
    OpenAPI specification (OAS) for the CEEMS REST API.

    See the Interactive Docs to try CEEMS API methods without writing code, and get
    the complete schema of resources exposed by the API.

    If basic auth is enabled, all the endpoints require authentication.

    All the endpoints, except `health`, `swagger`, `debug` and `demo`,
    must send a user-agent header.

    A demo instance of CEEMS API server is provided for the users to test. This
    instance is running at `https://ceems-demo.myaddr.tools:6443` and it is the
    default server that will serve the requests originating from current OAS client.

    Some of the valid users for this demo instance are:
    - arnold
    - betty
    - edna
    - gazoo
    - wilma

    Every request must contain a `X-Grafana-User` header with one of the usernames
    above as the value to the header. This is how CEEMS API server recognise the user.

    Some of the valid projects for this demo instance are:
    - bedrock
    - cornerstone

    Demo instance have CORS enabled to allow cross-domain communication from the browser.
    All responses have a wildcard same-origin which makes them completely public and
    accessible to everyone, including any code on any site.

    To test admin resources, users can use `admin` as `X-Grafana-User`.

    Timestamps must be specified in milliseconds, unless otherwise specified.
  license:
    name: GPL-3.0 license
    url: https://www.gnu.org/licenses/gpl-3.0.en.html
  title: CEEMS API
  version: "1.0"
  x-logo:
    altText: CEEMS logo
    url: https://raw.githubusercontent.com/ceems-dev/ceems/refs/heads/main/website/static/img/logo.png
openapi: 3.1.0
paths:
  /clusters/admin:
    get:
      description: |
        This endpoint will list all the cluster IDs in the CEEMS DB. The
        current user is always identified by the header `X-Grafana-User` in
        the request.

        This will list all the cluster IDs in the DB. This is primarily
        used to verify the CEEMS load balancer's backend IDs that should match
        with cluster IDs.
      parameters:
      - description: Current user name
        in: header
        name: X-Grafana-User
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.Response-models_Cluster'
          description: OK
        "401":
          content:
            application/json:
              schema:
                type: string
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.Response-any'
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.Response-any'
          description: Internal Server Error
      security:
      - BasicAuth: []
      summary: List clusters
      tags:
      - clusters
  /demo/{resource}:
    get:
      description: |-
        This endpoint returns sample response for units and usage models. This
        endpoint do not require the setting of `X-Grafana-User` header as it
        only returns mock data for each request. This can be used to introspect
        the response models for different resources.

        The endpoint requires a path parameter `resource` which takes either:
        - `units` which returns a mock units response
        - `usage` which returns a mock usage response.

        The mock data is generated randomly for each request and there is
        no guarantee that the data has logical sense.
      parameters:
      - description: Whether to return mock units or usage data
        in: path
        name: resource
        required: true
        schema:
          enum:
          - units
          - usage
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/http.Response-models_Unit'
                - $ref: '#/components/schemas/http.Response-models_Usage'
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.Response-any'
          description: Internal Server Error
      summary: Demo Units/Usage endpoints
      tags:
      - demo
  /health:
    get:
      description: |-
        This health endpoint can be used to check on the health of the API server
        in containerised and Kubernetes environments.

        This endpoint does not need any user header. However, if basic auth
        is enabled, authentication header must be provided to get status.
      responses:
        "200":
          content:
            text/plain:
              schema:
                type: string
          description: OK
        "401":
          content:
            text/plain:
              schema:
                type: string
          description: Unauthorized
        "503":
          content:
            text/plain:
              schema:
                type: string
          description: KO
      security:
      - BasicAuth: []
      servers:
      - description: Test CEEMS API server URL for health, swagger and debug endpoints
          only.
        url: https://ceems-demo.myaddr.tools:6443
      summary: Health check endpoint for API server.
      tags:
      - health
  /projects:
    get:
      description: |
        This endpoint will show details of the queried project of current user. The
        current user is always identified by the header `X-Grafana-User` in
        the request.

        The details include list of users in that project. If current user
        attempts to query a project that they are not part of, empty response
        will be returned
      parameters:
      - description: Current user name
        in: header
        name: X-Grafana-User
        required: true
        schema:
          type: string
      - description: Project
        in: query
        name: project
        schema:
          items:
            type: string
          type: array
        style: form
      - description: Cluster ID
        in: query
        name: cluster_id
        schema:
          items:
            type: string
          type: array
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.Response-models_Project'
          description: OK
        "401":
          content:
            application/json:
              schema:
                type: string
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.Response-any'
          description: Internal Server Error
      security:
      - BasicAuth: []
      summary: Show project details
      tags:
      - projects
  /projects/admin:
    get:
      description: |
        This endpoint will show details of the queried project. The
        current user is always identified by the header `X-Grafana-User` in
        the request.

        The user who is making the request must be in the list of admin users
        configured for the server.

        The details include list of users in that project. If current user
        attempts to query a project that they are not part of, empty response
        will be returned
      parameters:
      - description: Current user name
        in: header
        name: X-Grafana-User
        required: true
        schema:
          type: string
      - description: Project
        in: query
        name: project
        schema:
          items:
            type: string
          type: array
        style: form
      - description: Cluster ID
        in: query
        name: cluster_id
        schema:
          items:
            type: string
          type: array
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.Response-models_Project'
          description: OK
        "401":
          content:
            application/json:
              schema:
                type: string
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http.Response-any'
          description: Forbidden
        "500":
          content:
