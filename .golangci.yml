version: "2"
linters:
  default: all
  disable:
    - cyclop
    - depguard
    - dupl
    - dupword
    - err113
    - exhaustruct
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - gocritic
    - gocyclo
    - gosmopolitan
    - ireturn
    - lll
    - maintidx
    - mnd
    - nestif
    - paralleltest
    - prealloc
    - tagliatelle
    - testpackage
    - varnamelen
    - wrapcheck
    - wsl
  settings:
    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2 
    errcheck:
      exclude-functions:
        # Used in HTTP handlers, any error is handled by the server itself.
        - (net/http.ResponseWriter).Write
    lll:
      line-length: 160
    recvcheck:
      disable-builtin: true
      exclusions:
        - '*.String'
        - '*.Value'
        - '*.MarshalJSON'
        - '*.ID'
    revive:
      rules:
        - name: unused-parameter
          severity: warning
          disabled: true
    goconst:
      ignore-string-values: 
        - cpu
        - info
    gomoddirectives:
      replace-allow-list:
        - github.com/grafana/pyroscope/ebpf
        - github.com/go-openapi/testify/v2/assert/yaml
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Those reports are not relevant in tests.
      - linters: 
          - gosec
          - unqueryvet
          - errcheck
        # text: "(G705: XSS via taint analysis|G704: SSRF via taint analysis|G703: Path traversal via taint analysis|G702: Command injection via taint analysis|G306: Expect WriteFile permissions to be 0600 or less|G120: Parsing form data without limiting request body size can allow memory exhaustion (use http.MaxBytesReader)|net/http/httptest.NewRequest must not be called. use net/http/httptest.NewRequestWithContext)"
        path: _test.go
      - linters: 
          - gosec
          - noctx
          - unqueryvet
        # text: "(G705: XSS via taint analysis|G704: SSRF via taint analysis|G703: Path traversal via taint analysis|G702: Command injection via taint analysis|G306: Expect WriteFile permissions to be 0600 or less|G120: Parsing form data without limiting request body size can allow memory exhaustion (use http.MaxBytesReader)|net/http/httptest.NewRequest must not be called. use net/http/httptest.NewRequestWithContext)"
        path: scripts/mock_servers
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
