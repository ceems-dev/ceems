# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "gomod" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    groups:
      go-dependencies:
        applies-to: "version-updates"
        patterns:
          - "*"
      go-dependencies-security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"

  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/website" # Location of package manifests
    schedule:
      interval: "weekly"
    groups:
      npm-dependencies:
        applies-to: "version-updates"
        patterns:
          - "*"
      npm-dependencies-security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"

  - package-ecosystem: "github-actions" # See documentation for possible values
    directory: "/" # Workflow files stored in the default location of `.github/workflows`
    schedule:
      interval: "weekly"
    groups:
      actions-dependencies:
        applies-to: "version-updates"
        patterns:
          - "*"
      actions-dependencies-security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"
