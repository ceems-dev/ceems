name: Citation
on:
  workflow_dispatch:
  # Once the release has been published trigger the workflow
  # to update version numbers in docs
  release:
    types: [published]

permissions:
  # All nested workflows will inherit these permissions and so no need to declare
  # in each step file
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-citation:
    name: update-citation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Update citation in CITATION.cff
        run: ./scripts/update-citation.sh

      - name: Verify Changed files
        id: verify-changed-files
        run: |
          # If there are no changes exit code will be 0 and 1 if there are changes
          if git diff --exit-code CITATION.cff > /dev/null; then
              echo "files_changed=false" >> $GITHUB_OUTPUT
          else
              echo "files_changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit changes
        if: steps.verify-changed-files.outputs.files_changed == 'true'
        run: |
          git config --local user.email "bot@ceems.com"
          git config --local user.name "CEEMS bot"
          git add CITATION.cff
          git commit -m "chore: Update version in CITATION.cff" -s

      - name: Push changes
        if: steps.verify-changed-files.outputs.files_changed == 'true'
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.head_ref }}