name: Citation
on:
  workflow_dispatch:
  # Once the release has been published trigger the workflow
  # to update version numbers in docs
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-citation:
    name: update-citation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Update citation in CITATION.cff
        run: ./scripts/update-citation.sh

      - name: Verify Changed files
        id: verify-changed-files
        run: |
          # If there are no changes exit code will be 0 and 1 if there are changes
          if git diff --exit-code CITATION.cff > /dev/null; then
              echo "files_changed=false" >> $GITHUB_OUTPUT
          else
              echo "files_changed=true" >> $GITHUB_OUTPUT
          fi

      # Because of the branch protection rules, we cannot push to remote using classical
      # GITHUB_TOKEN anymore. We created an app with write permissions on the repo and
      # we bypass the app in the protection rules. We need to use the app generated token
      # to push the changes to remote
      - uses: actions/create-github-app-token@v3
        id: app-token
        if: steps.verify-changed-files.outputs.files_changed == 'true' && github.ref == 'refs/heads/main'
        with:
          app-id: 4221824
          private-key: ${{ secrets.APP_UPDATE_README_HELPER_PRIVATE_KEY }}

      - name: Commit changes
        if: steps.verify-changed-files.outputs.files_changed == 'true' && && github.ref == 'refs/heads/main'
        run: |
          git config --local user.email "bot@ceems.com"
          git config --local user.name "CEEMS bot"
          git add CITATION.cff
          git commit -m "chore: Update version in CITATION.cff" -s

      - name: Push changes
        if: steps.verify-changed-files.outputs.files_changed == 'true' && && github.ref == 'refs/heads/main'
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          branch: ${{ github.head_ref }}
